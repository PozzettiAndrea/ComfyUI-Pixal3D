[test]
levels = ["syntax", "javascript", "install", "registration", "instantiation", "execution"]
publish = true

[test.workflows]
# Pixal3D is pixel-aligned image-to-3D (Tencent ARC, SIGGRAPH 2026). The
# basic workflow loads HF-hosted weights + decodes a textured GLB, so it
# runs on GPU only. CPU platforms are disabled below for the same reason.
timeout = 600
cpu = []
cuda = ["pixal3d_basic"]

[test.platforms]
platforms = ["linux_cuda", "windows_cuda", "windows_portable_cuda", "windows_desktop_cuda"]
